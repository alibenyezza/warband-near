# Publishes the live page (near/web, static, reads NEAR testnet from the browser) to GitHub Pages.
name: pages
on:
  push:
    branches: [main]
    paths: ["near/web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: near/web
      - id: deployment
        uses: actions/deploy-pages@v4
