[package]
name = "warband"
description = "WARBAND: NEP-141 memecoin whose holders level up the longer they hold, with a built-in market and a rule-bound war chest"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/alibenyezza/warband-near"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.95.0"
image_digest = ""
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
near-sdk = "5.30.0"
near-contract-standards = "5.30.0"
uint = { version = "0.10", default-features = false }

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
