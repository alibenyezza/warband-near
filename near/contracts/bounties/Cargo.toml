[package]
name = "warband-bounties"
description = "WARBAND bounty board with earned trust: payouts from the Sputnik DAO treasury, tiered by each contributor's record"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/alibenyezza/warband-near"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
